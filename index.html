<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensaje Bonito</title>

    <style>
        body{
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .caja{
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.2);
        }

        h1{
            color: #ff4d6d;
            font-size: 40px;
        }

        p{
            font-size: 20px;
            color: #444;
        }

        button{
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: #ff4d6d;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover{
            background: #e63956;
        }
    </style>
</head>

<body>

    <div class="caja">
        <h1>💗hoda cadiño💗</h1>

        <p>
            Tus besos son la miel que necesita este oso corazón
        </p>

        <button onclick="mostrarMensaje()">
            Presióname
        </button>
    </div>

    <script>
        function mostrarMensaje(){
            alert("te amo de aqui al sol a pasitos de caracol");
        }
    </script>

</body>
</html>
