<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para el amor de mi vida ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    font-family:Arial;
}

/* Caja principal */

.carta{

    width:420px;
    background:white;
    padding:35px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 0 30px rgba(0,0,0,0.2);
    z-index:10;
    animation:aparecer 2s;

}

@keyframes aparecer{

    from{
        opacity:0;
        transform:scale(0.5);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}

h1{
    color:#ff4d6d;
    font-size:38px;
    margin-bottom:20px;
}

p{
    color:#444;
    font-size:22px;
    line-height:1.6;
    margin-bottom:25px;
}

/* Corazones */

.corazon{
    position:absolute;
    color:white;
    animation:subir 5s linear infinite;
}

@keyframes subir{

    from{
        transform:translateY(100vh);
        opacity:1;
    }

    to{
        transform:translateY(-100vh);
        opacity:0;
    }

}

</style>
</head>

<body>

<div class="carta">

<h1>💗Para mi vida💗</h1>

<p>
Si algún día te vas,  
mi razón de existir perdieria el sentido
</p>

<!-- SPOTIFY CORRECTO -->
<iframe style="border-radius:12px"
src="https://open.spotify.com/embed/track/6skX6In6VpLzev9epAUnpp?utm_source=generator"
width="100%"
height="152"
frameBorder="0"
allowfullscreen=""
allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
</iframe>

</div>

<script>

/* Corazones flotando */

setInterval(()=>{

    let corazon=document.createElement("div");

    corazon.innerHTML="❤️";

    corazon.classList.add("corazon");

    corazon.style.left=Math.random()*100+"vw";

    corazon.style.fontSize=(Math.random()*20+20)+"px";

    document.body.appendChild(corazon);

    setTimeout(()=>{
        corazon.remove();
    },5000);

},300);

</script>

</body>
</html>
